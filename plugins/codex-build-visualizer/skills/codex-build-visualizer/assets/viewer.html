<html lang="en">
<head>

  <title>Codex Build Visualizer</title>
  <style>
    :root {
      --bg: #080a0f;
      --panel: rgba(18, 21, 30, .84);
      --panel-solid: #12151e;
      --line: rgba(255,255,255,.09);
      --text: #f4f6fb;
      --muted: #9098aa;
      --purple: #9b7cff;
      --blue: #55b8ff;
      --green: #54dfa1;
      --red: #ff6f79;
      --amber: #ffbd5d;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 520px at 14% -10%, rgba(155,124,255,.16), transparent 58%),
        radial-gradient(800px 520px at 92% 2%, rgba(85,184,255,.11), transparent 55%),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .shell { width: min(1480px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 42px; position: relative; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
    .mark {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--purple), #6c54e8 55%, #4938ba);
      box-shadow: 0 12px 34px rgba(125,93,255,.28), inset 0 1px rgba(255,255,255,.3);
      font-weight: 900; font-size: 18px;
    }
    .brand-name { font-weight: 760; letter-spacing: -.02em; font-size: 15px; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .13em; text-transform: uppercase; }
    h1 { font-size: clamp(26px, 3.1vw, 44px); line-height: 1.06; letter-spacing: -.045em; margin: 0; max-width: 880px; }
    .project { color: var(--muted); margin-top: 10px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px; padding-top: 4px; max-width: 100%; }
    .pill, .icon-button {
      min-height: 38px; border: 1px solid var(--line); border-radius: 999px; background: rgba(17,20,29,.7);
      backdrop-filter: blur(16px); display: inline-flex; align-items: center; gap: 8px; padding: 0 13px;
    }
    .icon-button { cursor: pointer; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(84,223,161,.11); }
    .live-dot.done { background: var(--purple); box-shadow: 0 0 0 5px rgba(155,124,255,.11); }
    .stats { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
    .card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
      box-shadow: 0 20px 60px rgba(0,0,0,.18); backdrop-filter: blur(18px);
    }
    .stat { padding: 17px 18px; min-height: 104px; position: relative; overflow: hidden; }
    .stat::after { content: ""; position: absolute; width: 70px; height: 70px; right: -22px; top: -24px; border-radius: 50%; background: var(--accent, var(--purple)); filter: blur(28px); opacity: .18; }
    .stat-label { color: var(--muted); font-size: 12px; margin-bottom: 11px; }
    .stat-value { font-size: 25px; font-weight: 760; letter-spacing: -.035em; }
    .stat-note { color: var(--muted); font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, .8fr); gap: 14px; align-items: start; }
    .stack { display: grid; gap: 14px; min-width: 0; }
    .section { overflow: hidden; }
    .section-head { padding: 17px 19px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .section-title { font-weight: 700; letter-spacing: -.015em; }
    .count { color: var(--muted); font-size: 12px; }
    .plan-list { padding: 9px; display: grid; gap: 4px; }
    .plan-row { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 9px; min-height: 40px; border-radius: 12px; padding: 7px 9px; }
    .plan-row:hover { background: rgba(255,255,255,.035); }
    .plan-check { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: #07120d; font-size: 11px; }
    .plan-check.completed { background: var(--green); border-color: var(--green); }
    .plan-check.in_progress { border-color: var(--purple); box-shadow: inset 0 0 0 5px rgba(155,124,255,.2); }
    .plan-check.blocked { background: var(--red); border-color: var(--red); }
    .plan-state { color: var(--muted); font-size: 11px; }
    .progress-track { height: 6px; margin: 0 18px 17px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--purple), var(--blue)); box-shadow: 0 0 18px rgba(99,177,255,.3); transition: width .35s ease; }
    .timeline { padding: 7px 12px 14px; max-height: 690px; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    .timeline-tools { padding: 12px 16px; display: grid; grid-template-columns: minmax(180px,1fr) repeat(3,minmax(118px,.36fr)); gap: 8px; border-bottom: 1px solid var(--line); }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field > span { color: var(--muted); font-size: 10px; }
    .field input, .field select { width: 100%; min-height: 38px; color: var(--text); background: #0c0f16; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
    .field select { cursor: pointer; }
    .timeline-summary { padding: 8px 16px 0; color: var(--muted); font-size: 11px; }
    .pagination { padding: 9px 16px 14px; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid var(--line); }
    .page-button { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.045); padding: 0 11px; cursor: pointer; }
    .page-button:disabled { opacity: .38; cursor: default; }
    .page-label { color: var(--muted); min-width: 92px; text-align: center; font: 11px ui-monospace, monospace; }
    .retention-warning { margin: 12px 16px 0; padding: 10px 12px; border: 1px solid rgba(251,191,36,.35); border-radius: 10px; color: #fde68a; background: rgba(120,53,15,.22); font-size: 12px; line-height: 1.45; }
    .event { position: relative; display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 10px; padding: 10px 4px; }
    .event:not(:last-child)::before { content: ""; position: absolute; left: 24px; top: 47px; bottom: -4px; width: 1px; background: linear-gradient(var(--line), transparent); }
    .event-icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.045); border: 1px solid var(--line); z-index: 1; }
    .event.success .event-icon { color: var(--green); background: rgba(84,223,161,.08); border-color: rgba(84,223,161,.2); }
    .event.failure .event-icon { color: var(--red); background: rgba(255,111,121,.08); border-color: rgba(255,111,121,.2); }
    .event.running .event-icon { color: var(--purple); background: rgba(155,124,255,.09); border-color: rgba(155,124,255,.22); }
    .event-main { min-width: 0; padding-top: 1px; }
    .event-meta { display: flex; gap: 9px; align-items: baseline; margin-bottom: 3px; }
    .event-title { font-weight: 650; overflow-wrap: anywhere; }
    .event-time { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
    .event-status, .run-status-label { color: var(--muted); font: 700 9px/1.3 ui-monospace, monospace; letter-spacing: .04em; text-transform: uppercase; }
    .event-detail { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .event-command { margin-top: 7px; color: #cbd1df; background: #0a0c12; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; }
    .event-output { margin: 7px 0 0; max-height: 180px; overflow: auto; color: #b8c1d4; background: #080a0f; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .evidence { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .evidence span { border: 1px solid rgba(84,223,161,.18); background: rgba(84,223,161,.07); color: #a9eccc; border-radius: 999px; padding: 2px 7px; font: 10px/1.4 ui-monospace, monospace; }
    .file-list, .run-list { padding: 8px; max-height: 385px; overflow: auto; }
    .file-row { display: grid; grid-template-columns: 23px minmax(0,1fr) auto; gap: 7px; align-items: center; padding: 8px 7px; border-radius: 10px; }
    .file-row:hover { background: rgba(255,255,255,.035); }
    .file-type { font: 700 10px/20px ui-monospace, monospace; text-align: center; width: 20px; height: 20px; border-radius: 6px; }
    .file-type.added { color: var(--green); background: rgba(84,223,161,.1); }
    .file-type.modified { color: var(--amber); background: rgba(255,189,93,.1); }
    .file-type.deleted { color: var(--red); background: rgba(255,111,121,.1); }
    .file-name { font: 11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delta { font: 11px ui-monospace, monospace; white-space: nowrap; }
    .plus { color: var(--green); } .minus { color: var(--red); margin-left: 5px; }
    .run-row { padding: 10px; border-radius: 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
    .run-top { display: flex; align-items: center; gap: 8px; }
    .run-status { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .run-status.success { background: var(--green); } .run-status.failure { background: var(--red); }
    .run-title { font-weight: 650; min-width: 0; flex: 1; }
    .run-duration { color: var(--muted); font-size: 11px; }
    .run-command { color: var(--muted); font: 11px/1.4 ui-monospace, monospace; margin: 5px 0 0 16px; word-break: break-all; }
    .token-body { padding: 16px; }
    .quality-badge { border: 1px solid rgba(155,124,255,.25); color: #cbbfff; background: rgba(155,124,255,.09); border-radius: 999px; padding: 3px 8px; font: 700 9px/1.2 ui-monospace, monospace; letter-spacing: .08em; }
    .quality-badge.actual { color: var(--green); border-color: rgba(84,223,161,.24); background: rgba(84,223,161,.08); }
    .quality-badge.estimated, .quality-badge.derived { color: var(--amber); border-color: rgba(255,189,93,.24); background: rgba(255,189,93,.08); }
    .token-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .token-label { color: var(--muted); font-size: 11px; }
    .token-value { font-size: 26px; font-weight: 760; letter-spacing: -.035em; margin-top: 3px; }
    .token-ratio { color: var(--muted); font: 12px ui-monospace, monospace; }
    .token-bar { height: 8px; background: rgba(255,255,255,.055); border-radius: 99px; overflow: hidden; margin: 12px 0 16px; }
    .token-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--purple),var(--blue)); }
    .token-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .activity-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; padding: 14px; }
    .activity-metric { border: 1px solid rgba(255,255,255,.055); border-radius: 11px; padding: 10px; }
    .activity-value { margin-top: 3px; font: 700 17px/1.2 ui-monospace, monospace; }
    .token-metric { border: 1px solid rgba(255,255,255,.055); border-radius: 11px; padding: 9px 10px; min-width: 0; }
    .token-metric-value { font: 650 14px/1.3 ui-monospace, monospace; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-quality { color: var(--muted); font: 700 8px ui-monospace, monospace; margin-left: 4px; vertical-align: 2px; }
    .token-source { margin-top: 12px; color: var(--muted); font-size: 10.5px; overflow-wrap: anywhere; }

    .trend-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-weight: 650; font-size: 12px; }
    .trend-chart { width: 100%; height: 112px; display: block; border: 1px solid rgba(255,255,255,.055); border-radius: 11px; background: rgba(0,0,0,.12); }
    .trend-grid { stroke: rgba(255,255,255,.07); stroke-width: 1; }
    .trend-line { fill: none; stroke-width: 2.2; vector-effect: non-scaling-stroke; }
    .trend-line.model-input { stroke: var(--blue); }
    .trend-line.effective-user { stroke: var(--purple); }
    .trend-line.saved { stroke: var(--green); }

    .trend-dot { vector-effect: non-scaling-stroke; }
    .trend-dot.model-input { color: var(--blue); }
    .trend-dot.effective-user { color: var(--purple); }
    .trend-dot.saved { color: var(--green); }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; color: var(--muted); font-size: 10px; }
    .trend-key::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 5px; vertical-align: 3px; background: var(--key); }
    .data-table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .data-table th, .data-table td { padding: 6px 7px; text-align: right; border-top: 1px solid rgba(255,255,255,.055); white-space: nowrap; }
    .data-table th:first-child, .data-table td:first-child { text-align: left; }

    .lane-label { color: var(--muted); font: 10.5px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lane-track { display: flex; align-items: center; gap: 4px; min-height: 32px; padding: 4px 6px; border-radius: 9px; background: rgba(255,255,255,.025); overflow-x: auto; }
    .lane-event { flex: 0 0 auto; min-width: 27px; height: 24px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: rgba(255,255,255,.045); cursor: pointer; font: 10px ui-monospace, monospace; }
    .lane-event.failure { color: var(--red); border-color: rgba(255,111,121,.25); }
    .lane-event.running { color: var(--purple); border-color: rgba(155,124,255,.25); }
    .history-body { padding: 12px 16px 16px; }
    .history-select { width: 100%; min-height: 38px; margin-bottom: 9px; color: var(--text); background: #0c0f16; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
    .delta-good { color: var(--green); } .delta-bad { color: var(--red); }
    .empty { color: var(--muted); padding: 24px 16px; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .privacy { padding: 15px 17px; color: var(--muted); font-size: 11.5px; }
    .privacy strong { color: #c7ccda; }
    .replay { position: sticky; z-index: 10; bottom: 14px; margin-top: 14px; padding: 13px 15px; display: grid; grid-template-columns: auto minmax(120px,1fr) auto; gap: 13px; align-items: center; background: rgba(15,18,26,.92); }
    .play { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,.055); cursor: pointer; }
    .play:hover { background: rgba(155,124,255,.18); }
    .scrub { min-width: 0; }
    input[type="range"] { width: 100%; accent-color: var(--purple); display: block; }
    .replay-label { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; margin-top: 3px; }
    .frame { min-width: 82px; text-align: right; font: 12px ui-monospace, monospace; color: #c9cfdd; }
    .loading { min-height: 70vh; display: grid; place-items: center; color: var(--muted); }
    @media (max-width: 1200px) { .stats { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2,1fr); }
      .layout { grid-template-columns: 1fr; }
      .timeline { max-height: 580px; }
      .timeline-tools { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 20px, 1480px); padding-top: 18px; }
      .topbar { display: block; }
      .actions { margin-top: 16px; justify-content: flex-start; }
      .pill { max-width: 100%; }
      .pill span { overflow-wrap: anywhere; }
      .stats { gap: 8px; }
      .stat { min-height: 96px; padding: 14px; }
      .stat-value { font-size: 21px; }
      .layout, .stack { gap: 10px; }
      .card { border-radius: 17px; }
      .replay { bottom: 8px; grid-template-columns: auto minmax(80px,1fr); }
      .frame { grid-column: 2; text-align: left; }
      .timeline-tools { grid-template-columns: 1fr; }
      .lane-row { grid-template-columns: 60px minmax(0,1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
